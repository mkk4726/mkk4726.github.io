* { box-sizing: border-box; }
body {

h2 { font-size: 20px; font-weight: 600; }

.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg); }
input[type=search] { font: inherit; font-size: 14px; flex: 1 1 180px; min-width: 0; padding: 7px 12px; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); color: var(--ink); }
.count { color: var(--muted); font-size: 13px; font-weight: 400; }
.group { display: grid; gap: 6px; }
.group h3 { margin: 6px 0 0; font-family: var(--f-mono); font-size: 12px; font-weight: 500; letter-spacing: .05em; color: var(--muted); }
.rows { padding: 4px 0; }
.row { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 4px 16px; padding: 9px 18px; border-top: 1px solid var(--rule); }
.row:first-child { border-top: 0; }
.row .p { font-family: var(--f-display); font-weight: 600; font-size: 16px; }

.uk { display: inline-block; font-family: var(--f-body); font-size: 11px; font-weight: 500; background: var(--tint-gold); color: var(--gold); border-radius: 999px; padding: 0 8px; margin-left: 6px; vertical-align: 2px; }
.empty { color: var(--muted); padding: 14px 18px; }
.row .line { grid-column: 1 / -1; font-size: 14px; font-style: italic; color: var(--ink); opacity: .85; border-left: 3px solid var(--tint); padding-left: 10px; }
.row .line::before { content: "대사 "; font-style: normal; font-size: 11px; color: var(--accent); margin-right: 4px; }
.tabs { display: flex; gap: 0; border-bottom: 1px solid var(--rule); }
.tab { font: inherit; font-size: 15px; font-weight: 600; background: none; border: 0; border-bottom: 3px solid transparent; color: var(--muted); padding: 8px 14px; cursor: pointer; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

.qa + .qa { border-top: 1px solid var(--rule); }
.qa .qq { font-size: 13px; color: var(--muted); }
.qa blockquote { margin: 0; font-family: var(--f-display); font-size: 17px; font-weight: 500; font-style: italic; border-left: 3px solid var(--accent); padding-left: 12px; }

footer { color: var(--muted); font-size: 13px; }

  .row { grid-template-columns: 1fr; padding: 10px 14px; }

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const md = (d) => d.slice(5).replace("-", "/");

$("#updated").textContent = UPDATED;
$("#stats").innerHTML =
  `<span><b>${DAYS.length}</b>일</span><span><b>${EXPRS.length}</b>개 표현</span><span><b>${QA.length}</b>개 질문</span><span><b>${EXPRS.filter((e) => e.uk).length}</b>개 영국식</span>`;

$("#days").innerHTML = DAYS.slice().reverse().map((d) => `
  <div class="card day">
    <span class="date">${esc(d.d)}</span>
    <span class="scene"><b>${esc(d.mv)}</b> · ${esc(d.scene)}</span>
    <span class="n">${d.n}개</span>
  </div>`).join("");

let movie = "전체", view = "ex";
const FILTERS = ["전체", ...new Set(DAYS.map((d) => d.mv)), "영국식만"];
const bar = $("#movieBar");
FILTERS.forEach((f) => {
  const b = document.createElement("button");
  b.className = "chip"; b.type = "button"; b.textContent = f;
  b.setAttribute("aria-pressed", String(f === movie));
  b.addEventListener("click", () => { movie = f; [...bar.children].forEach((c) => c.setAttribute("aria-pressed", String(c === b))); render(); });
  bar.appendChild(b);
});
[["#tab-ex", "ex"], ["#tab-qa", "qa"]].forEach(([id, v]) => $(id).addEventListener("click", () => {
  view = v; $("#tab-ex").setAttribute("aria-selected", String(v === "ex")); $("#tab-qa").setAttribute("aria-selected", String(v === "qa")); render();
}));

const okMovie = (x) => movie === "전체" || (movie === "영국식만" ? x.uk : x.mv === movie);
const groupByDay = (rows) => {
  const m = new Map();
  rows.forEach((x) => { if (!m.has(x.d)) m.set(x.d, []); m.get(x.d).push(x); });
  return [...m.entries()].sort((a, b) => b[0].localeCompare(a[0]));
};
const norm = (s) => s.replace(/["“”?.…]/g, "").trim().toLowerCase();

function render() {
  const q = $("#q").value.trim().toLowerCase();
  const exRows = EXPRS.filter((e) => okMovie(e) && (!q || [e.p, e.m, e.l].join(" ").toLowerCase().includes(q)));
  const qaRows = QA.filter((x) => movie !== "영국식만" && (movie === "전체" || x.mv === movie) &&
    (!q || [x.q, x.l, x.m, ...x.ex.map((e) => e.en + " " + e.ko)].join(" ").toLowerCase().includes(q)));
  $("#exCount").textContent = exRows.length;
  $("#qaCount").textContent = qaRows.length;
  const rows = view === "ex" ? exRows : qaRows;
  if (!rows.length) { $("#list").innerHTML = `<div class="card empty">맞는 것이 없다.</div>`; return; }
  $("#list").innerHTML = groupByDay(rows).map(([d, list]) => `
    <div class="group">
      <h3>${md(d)} · ${esc(list[0].mv)}</h3>
      ${view === "ex" ? `<div class="card rows">${list.map((e) => `
        <div class="row"><span class="p">${esc(e.p)}${e.uk ? '<span class="uk">영국식</span>' : ""}</span><span class="m">${esc(e.m)}</span>${e.l ? `<span class="line">${esc(e.l)}</span>` : ""}</div>`).join("")}
      </div>` : `<div class="card" style="padding:0">${list.map((x) => `
        <div class="qa">
          ${x.l && norm(x.q) !== norm(x.l) ? `<div class="qq">Q. ${esc(x.q)}</div>` : !x.l ? `<div class="qq">Q. ${esc(x.q)}</div>` : ""}
          ${x.l ? `<blockquote>${esc(x.l)}</blockquote>` : ""}
          ${x.m ? `<div class="qm"><b>뜻</b> ${esc(x.m)}</div>` : ""}
          ${x.ex.length ? `<div class="lab">이렇게도 써요</div><ul>${x.ex.map((e) => `<li><span class="en">${esc(e.en)}</span>${e.ko ? `<span class="ko">${esc(e.ko)}</span>` : ""}</li>`).join("")}</ul>` : ""}
        </div>`).join("")}
      </div>`}
    </div>`).join("");
}
$("#q").addEventListener("input", render);
render();
</script>
</body>
</html>
