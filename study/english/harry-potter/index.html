<style>
:root {

}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f141c; --surface: #171e29; --ink: #e8edf4; --muted: #9aa6b8; --rule: #2a3343;

  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 var(--f-body);

}
.wrap { max-width: 860px; margin: 0 auto; display: grid; gap: 32px; }
a { color: var(--accent); }
.back { font-size: 13px; color: var(--muted); text-decoration: none; }
.back:hover { text-decoration: underline; }
h1, h2 { font-family: var(--f-display); margin: 0; text-wrap: balance; }
h1 { font-size: clamp(28px, 4.5vw, 42px); line-height: 1.15; letter-spacing: -0.01em; }
h2 { font-size: 20px; font-weight: 600; }
.eyebrow { font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
header { display: grid; gap: 12px; }
header p { margin: 0; color: var(--muted); max-width: 62ch; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: 14px; color: var(--muted); }
.stats b { color: var(--ink); font-weight: 600; font-family: var(--f-display); font-size: 18px; margin-right: 4px; }
section { display: grid; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 16px 18px; }
.days { display: grid; gap: 8px; }
.day { display: grid; grid-template-columns: 96px 1fr auto; gap: 4px 14px; align-items: baseline; padding: 10px 14px; }
.day .date { font-family: var(--f-mono); font-size: 13px; }
.day .scene { color: var(--muted); font-size: 14px; }
.day .scene b { color: var(--ink); font-weight: 500; }
.day .n { font-family: var(--f-mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { font: inherit; font-size: 13px; border: 1px solid var(--rule); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 5px 13px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg); }
input[type=search] { font: inherit; font-size: 14px; flex: 1 1 180px; min-width: 0; padding: 7px 12px; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); color: var(--ink); }
.count { color: var(--muted); font-size: 13px; font-weight: 400; }
.group { display: grid; gap: 6px; }
.group h3 { margin: 6px 0 0; font-family: var(--f-mono); font-size: 12px; font-weight: 500; letter-spacing: .05em; color: var(--muted); }
.rows { padding: 4px 0; }
.row { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 4px 16px; padding: 9px 18px; border-top: 1px solid var(--rule); }
.row:first-child { border-top: 0; }
.row .p { font-family: var(--f-display); font-weight: 600; font-size: 16px; }
.row .m { color: var(--muted); }
.uk { display: inline-block; font-family: var(--f-body); font-size: 11px; font-weight: 500; background: var(--tint-gold); color: var(--gold); border-radius: 999px; padding: 0 8px; margin-left: 6px; vertical-align: 2px; }
.empty { color: var(--muted); padding: 14px 18px; }
footer { color: var(--muted); font-size: 13px; }
@media (max-width: 560px) {
  .day { grid-template-columns: 1fr auto; }
  .day .scene { grid-column: 1 / -1; }
  .row { grid-template-columns: 1fr; padding: 10px 14px; }

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const md = (d) => d.slice(5).replace("-", "/");

$("#updated").textContent = UPDATED;
$("#stats").innerHTML =
  `<span><b>${DAYS.length}</b>일</span><span><b>${EXPRS.length}</b>개 표현</span><span><b>${EXPRS.filter((e) => e.uk).length}</b>개 영국식</span>`;

$("#days").innerHTML = DAYS.slice().reverse().map((d) => `
  <div class="card day">
    <span class="date">${esc(d.d)}</span>
    <span class="scene"><b>${esc(d.mv)}</b> · ${esc(d.scene)}</span>
    <span class="n">${d.n}개</span>
  </div>`).join("");

let movie = "전체";
const FILTERS = ["전체", ...new Set(DAYS.map((d) => d.mv)), "영국식만"];
const bar = $("#movieBar");
FILTERS.forEach((f) => {
  const b = document.createElement("button");
  b.className = "chip"; b.type = "button"; b.textContent = f;
  b.setAttribute("aria-pressed", String(f === movie));
  b.addEventListener("click", () => { movie = f; [...bar.children].forEach((c) => c.setAttribute("aria-pressed", String(c === b))); render(); });
  bar.appendChild(b);
});

function render() {
  const q = $("#q").value.trim().toLowerCase();
  const rows = EXPRS.filter((e) =>
    (movie === "전체" || (movie === "영국식만" ? e.uk : e.mv === movie)) &&
    (!q || (e.p + " " + e.m).toLowerCase().includes(q)));
  $("#exCount").textContent = rows.length + "/" + EXPRS.length;
  if (!rows.length) { $("#list").innerHTML = `<div class="card empty">맞는 표현이 없다.</div>`; return; }
  const byDay = new Map();
  rows.forEach((e) => { if (!byDay.has(e.d)) byDay.set(e.d, []); byDay.get(e.d).push(e); });
  $("#list").innerHTML = [...byDay.entries()].sort((a, b) => b[0].localeCompare(a[0])).map(([d, list]) => `
    <div class="group">
      <h3>${md(d)} · ${esc(list[0].mv)}</h3>
      <div class="card rows">${list.map((e) => `
        <div class="row"><span class="p">${esc(e.p)}${e.uk ? '<span class="uk">영국식</span>' : ""}</span><span class="m">${esc(e.m)}</span></div>`).join("")}
      </div>
    </div>`).join("");
}
$("#q").addEventListener("input", render);
render();
</script>
